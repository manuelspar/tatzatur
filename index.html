<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tatzatur</title>
<style>
:root{
  --bg:#fbf4e8; --card:#fffaf1; --ink:#2b2018; --muted:#7a6a5a; --line:#eadcc6;
  --accent:#e8721c; --accent-ink:#fff; --board:#2a211b; --key:#f6e9d2; --key-ink:#3a2c20; --key-sub:#a08c74;
  --glow:#e8721c;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1a1410; --card:#241c16; --ink:#f4e8d6; --muted:#b09c85; --line:#3a2e24;
  --accent:#f08a3c; --accent-ink:#1a1410; --board:#100c09; --key:#e9d9bd; --key-ink:#2a1f16; --key-sub:#8c7a63;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 48px}
h1{margin:0 0 4px;font-size:2rem;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.sub{margin:0 0 20px;color:var(--muted)}
[role=tablist]{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
[role=tab]{font:inherit;font-weight:600;padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
[role=tab][aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
[role=tab]:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pw{margin-bottom:14px;display:flex;align-items:center;gap:12px}
.sw{flex:none;display:inline-flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;width:fit-content}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw i{position:relative;width:44px;height:26px;border-radius:999px;background:var(--line);border:2px solid var(--line);transition:background .2s}
.sw i::after{content:"";position:absolute;top:1px;left:1px;width:20px;height:20px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.sw b{font-weight:600}
.sw input:checked+i{background:var(--accent);border-color:var(--accent)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:3px solid var(--accent);outline-offset:2px}
.pwrow{flex:1;min-width:0;display:flex;gap:8px}
.pwrow[hidden]{display:flex;visibility:hidden}
@media (max-width:360px){.sw{gap:8px}.sw b{display:none}.pw{gap:8px}}
.pwrow input{flex:1;min-width:0;font:inherit;padding:9px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.pwrow input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pwrow button{font:inherit;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.panel[hidden]{display:none}
.panel{display:grid;gap:12px}
label{font-weight:600}
textarea{width:100%;min-height:120px;resize:vertical;padding:12px 14px;font:inherit;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
textarea[readonly]{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.act{font:inherit;font-weight:600;padding:9px 16px;border-radius:12px;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
button.act.primary{background:var(--accent);color:var(--accent-ink)}
.err{color:#c0392b;font-weight:600;min-height:1.5em;margin:0}
@media (prefers-color-scheme:dark){.err{color:#ff8a78}}
.board{margin-top:28px;container-type:inline-size;background:var(--board);border-radius:18px;padding:2.2cqw;padding:min(2.2%,16px)}
.kb{position:relative;width:100%;aspect-ratio:12.885/5.3;--w:12.885;--s:calc(15 / var(--w));container-type:inline-size;pointer-events:none;user-select:none}
.k{position:absolute;display:flex;flex-direction:column;justify-content:space-between;padding:calc(.5cqw * var(--s)) calc(.8cqw * var(--s));
  width:calc(88.5% / var(--w));height:17.2%;border-radius:calc(.9cqw * var(--s));background:var(--key);color:var(--key-ink);
  box-shadow:0 calc(.5cqw * var(--s)) 0 rgba(0,0,0,.35);font-size:calc(2.3cqw * var(--s));line-height:1;font-weight:600;transition:background .25s,transform .25s,box-shadow .25s}
.k small{font-size:calc(1.6cqw * var(--s));color:var(--key-sub);font-weight:500}
.k.space{width:calc(500% / var(--w))}
.k.hit{background:var(--glow);color:#fff;transform:translateY(calc(.4cqw * var(--s)));box-shadow:0 calc(.1cqw * var(--s)) 0 rgba(0,0,0,.35),0 0 calc(3cqw * var(--s)) var(--glow)}
.k.hit small{color:#ffe3cc}
.k.paw{background:color-mix(in srgb,var(--glow) 45%,var(--key));transform:translateY(calc(.25cqw * var(--s)))}
</style>
</head>
<body>
<main>
  <h1>Tatz<span>atur</span> 🐾</h1>
  <p class="sub">Jeder Buchstabe bekommt Besuch von seinen Nachbartasten. Aus Text wird Katzenkauderwelsch, und zurück geht es ohne Verlust.</p>

  <div class="pw">
    <label class="sw"><input type="checkbox" id="pw-on"><i aria-hidden="true"></i><span>🔑<b> Passwort</b></span></label>
    <div class="pwrow" id="pw-row" hidden>
      <input type="password" id="pw" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Passwort">
      <button type="button" id="pw-eye" aria-label="Passwort anzeigen" aria-pressed="false">👁</button>
    </div>
  </div>

  <div role="tablist" aria-label="Modus">
    <button role="tab" id="tab-enc" aria-controls="p-enc" aria-selected="true">🐾 Katze drüberlaufen lassen</button>
    <button role="tab" id="tab-dec" aria-controls="p-dec" aria-selected="false" tabindex="-1">🔓 Entkatzen</button>
  </div>

  <section class="panel" id="p-enc" role="tabpanel" aria-labelledby="tab-enc">
    <label for="enc-in">Klartext</label>
    <textarea id="enc-in" placeholder="Hallo Welt" spellcheck="false"></textarea>
    <label for="enc-out">Katzentext</label>
    <textarea id="enc-out" readonly></textarea>
    <div class="row">
      <button class="act primary" id="enc-copy" type="button">Kopieren</button>
      <button class="act" id="enc-go" type="button">In Entkatzen übernehmen</button>
    </div>
  </section>

  <section class="panel" id="p-dec" role="tabpanel" aria-labelledby="tab-dec" hidden>
    <label for="dec-in">Katzentext</label>
    <textarea id="dec-in" spellcheck="false"></textarea>
    <label for="dec-out">Klartext</label>
    <textarea id="dec-out" readonly></textarea>
    <p class="err" id="dec-err" role="alert"></p>
    <div class="row"><button class="act primary" id="dec-copy" type="button">Kopieren</button></div>
  </section>

  <div class="board" aria-hidden="true"><div class="kb" id="kb"></div></div>
</main>
<script src="tatzatur.js"></script>
<script>
(function () {
  var T = window.Tatzatur, $ = function (id) { return document.getElementById(id); };
  function key() { return $('pw-on').checked ? $('pw').value : ''; }
  var kb = $('kb'), els = new Map(), timers = [];

  function el(key) {
    var d = document.createElement('div'); d.className = 'k';
    return d;
  }
  // Rasterbreite aus den Daten: rechte Kante der äußersten Taste (Tastenbreite 0,885 Einheiten)
  var KW = 0.885, SP = T.LAYOUT.space;
  var GW = Math.max(SP.x + SP.w, Math.max.apply(null, T.LAYOUT.keys.map(function (k) { return k.x + 1; }))) - (1 - KW);
  kb.style.setProperty('--w', GW); kb.style.aspectRatio = GW + ' / 5.3';
  T.LAYOUT.keys.forEach(function (k) {
    var d = el(); d.style.left = (k.x / GW * 100) + '%';
    d.style.top = (k.row * 18.9) + '%';
    d.innerHTML = '<small></small><span></span>';
    d.firstChild.textContent = k.shift; d.lastChild.textContent = k.main;
    kb.appendChild(d); els.set(k.main, d); els.set(k.shift, d);
  });
  var sp = el(); sp.className = 'k space'; sp.style.left = (T.LAYOUT.space.x / GW * 100) + '%'; sp.style.top = (4 * 18.9) + '%';
  kb.appendChild(sp); els.set(' ', sp);

  function clear() {
    timers.forEach(clearTimeout); timers = [];
    els.forEach(function (d) { d.classList.remove('hit', 'paw'); });
  }
  function show(ch, paws) {
    clear();
    var main = els.get(ch);
    if (main) main.classList.add('hit');
    var seen = new Set([main]);
    (paws || []).forEach(function (c, i) {
      var d = els.get(c);
      if (!d || seen.has(d)) return;
      seen.add(d);
      timers.push(setTimeout(function () { d.classList.add('paw'); }, 70 * (i + 1)));
    });
    timers.push(setTimeout(clear, 1400));
  }

  function lastChar(s) { var a = Array.from(s); return a.length ? a[a.length - 1] : null; }

  function runEnc() {
    var v = $('enc-in').value;
    $('enc-out').value = T.encode(v, key());
    var a = Array.from(v);
    if (a.length) {
      var g = T.group(a[a.length - 1], a.length - 1, key());
      show(a[a.length - 1], g.chars.filter(function (_, i) { return i !== g.p; }));
    } else clear();
  }
  function runDec() {
    var v = $('dec-in').value, err = $('dec-err');
    try {
      var out = T.decode(v, key());
      $('dec-out').value = out; err.textContent = '';
      var c = lastChar(out); if (c) show(c); else clear();
    } catch (e) {
      $('dec-out').value = ''; err.textContent = key() ? 'Kein gültiger Tatzatur-Text – falsches Passwort?' : e.message;
    }
  }

  var tabs = [$('tab-enc'), $('tab-dec')], panels = [$('p-enc'), $('p-dec')];
  function select(i) {
    tabs.forEach(function (t, j) {
      t.setAttribute('aria-selected', String(i === j)); t.tabIndex = i === j ? 0 : -1; panels[j].hidden = i !== j;
    });
    clear();
  }
  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { select(i); });
    t.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { var j = 1 - i; select(j); tabs[j].focus(); }
    });
  });

  function copy(id, btn) {
    var f = $(id), old = btn.textContent;
    function done() { btn.textContent = 'Kopiert ✓'; setTimeout(function () { btn.textContent = old; }, 1400); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(f.value).then(done, function () { f.select(); document.execCommand('copy'); done(); });
    else { f.select(); document.execCommand('copy'); done(); }
  }
  $('enc-copy').addEventListener('click', function () { copy('enc-out', this); });
  $('dec-copy').addEventListener('click', function () { copy('dec-out', this); });
  $('enc-go').addEventListener('click', function () { $('dec-in').value = $('enc-out').value; select(1); runDec(); });
  function runAll() { runEnc(); runDec(); }
  $('pw-on').addEventListener('change', function () {
    $('pw-row').hidden = !this.checked;
    if (this.checked) $('pw').focus();
    runAll();
  });
  $('pw').addEventListener('input', runAll);
  $('pw-eye').addEventListener('click', function () {
    var show = $('pw').type === 'password';
    $('pw').type = show ? 'text' : 'password';
    this.setAttribute('aria-pressed', String(show));
    this.setAttribute('aria-label', show ? 'Passwort verbergen' : 'Passwort anzeigen');
  });
  $('enc-in').addEventListener('input', runEnc);
  $('dec-in').addEventListener('input', runDec);
})();
</script>
</body>
</html>
